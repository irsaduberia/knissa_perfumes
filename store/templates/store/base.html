{% load static %}

<link rel="stylesheet" href="{% static 'css/style.css' %}"?v=1>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Knissa Perfumes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
</head>


<body>

<header>
    <div class="logo">
    <a href="{% url 'home' %}">
        {% if site_settings and site_settings.logo %}
            <img src="{{ site_settings.logo.url }}">
        {% else %}
            <h2>K-Nissa</h2>
        {% endif %}
    </a>
</div>

    <nav>
    <a href="{% url 'home' %}">Home</a>
    <a href="{% url 'him' %}">Him</a>
<a href="{% url 'her' %}">Her</a>
<a href="{% url 'unisex' %}">Unisex</a>
<a href="{% url 'oud' %}">Oud</a>
    <a href="{% url 'view_cart' %}">Cart</a>
</nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <div>© {{ year|default:"2025" }} Knissa Perfumes</div>
    <div>
        <a href="https://wa.me/918097105473" target="_blank">WhatsApp</a>
        <a href="https://instagram.com/knissaperfumes" target="_blank">Instagram</a>
    </div>
</footer> 



<script>
let slides = document.querySelectorAll('.slide');

if (slides.length > 0) {
    let index = 0;

    setInterval(() => {
        slides[index].classList.remove('active');
        index = (index + 1) % slides.length;
        slides[index].classList.add('active');
    }, 3000);
}
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const elements = document.querySelectorAll(".product-card, .category-block, .section-title-box");

    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("show");
            }
        });
    }, {
        threshold: 0.1
    });

    elements.forEach(el => {
        el.classList.add("fade-in");
        observer.observe(el);
    });
});
</script>

</body>
</html>
